<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dff2ff">
  <title>CHAI · 个人介绍</title>
  <style>
    :root {
      color-scheme: light;
      --background: #dff2ff;
      --card: rgba(255, 255, 255, 0.76);
      --text: #203449;
      --muted: #62778a;
      --accent: #438bb8;
      --line: rgba(61, 111, 147, 0.16);
      --shadow: 0 24px 70px rgba(52, 104, 140, 0.12);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --background: #152431;
      --card: rgba(31, 49, 64, 0.9);
      --text: #edf6fc;
      --muted: #a7bac8;
      --accent: #91d3f5;
      --line: rgba(201, 226, 242, 0.16);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.24);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.72), transparent 30%),
        var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      transition: background-color 220ms ease, color 220ms ease;
    }

    .card {
      width: min(100%, 560px);
      padding: clamp(28px, 7vw, 54px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .top-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 30px;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font: inherit;
      cursor: pointer;
      transition: background 180ms ease, transform 180ms ease;
    }

    .theme-toggle:hover {
      background: var(--line);
      transform: translateY(-1px);
    }

    .theme-toggle:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 12vw, 4.5rem);
      line-height: 1;
      letter-spacing: 0.03em;
    }

    .intro {
      margin: 22px 0 34px;
      color: var(--muted);
      font-size: clamp(1.05rem, 4vw, 1.25rem);
      line-height: 1.8;
    }

    .divider {
      height: 1px;
      background: var(--line);
    }

    .interests {
      padding-top: 26px;
    }

    .interests h2 {
      margin: 0 0 16px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
    }

    .interest {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 1rem;
    }

    .movie-icon {
      font-size: 1.2rem;
    }

    @media (max-width: 420px) {
      .card {
        border-radius: 22px;
      }

      .top-row {
        margin-bottom: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="top-row">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
        <span id="theme-icon" aria-hidden="true">🌙</span>
        <span id="theme-label">深色模式</span>
      </button>
    </div>

    <p class="eyebrow">你好，很高兴认识你</p>
    <h1>CHAI</h1>
    <p class="intro">一切都是波浪</p>

    <div class="divider"></div>
    <section class="interests" aria-labelledby="interests-title">
      <h2 id="interests-title">兴趣爱好</h2>
      <div class="interest">
        <span class="movie-icon" aria-hidden="true">🎬</span>
        <span>观看电影</span>
      </div>
    </section>
  </main>

  <script>
    const toggle = document.querySelector("#theme-toggle");
    const label = document.querySelector("#theme-label");
    const icon = document.querySelector("#theme-icon");

    toggle.addEventListener("click", () => {
      const isDark = document.documentElement.dataset.theme !== "dark";
      document.documentElement.dataset.theme = isDark ? "dark" : "light";
      toggle.setAttribute("aria-pressed", String(isDark));
      label.textContent = isDark ? "浅色模式" : "深色模式";
      icon.textContent = isDark ? "☀️" : "🌙";
    });
  </script>
</body>
</html>
