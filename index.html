<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dff2ff">
  <title>CHAI · 个人介绍</title>
  <style>
    :root {
      color-scheme: light;
      --background: #dff2ff;
      --card: rgba(255, 255, 255, 0.76);
      --text: #203449;
      --muted: #62778a;
      --accent: #438bb8;
      --line: rgba(61, 111, 147, 0.16);
      --shadow: 0 24px 70px rgba(52, 104, 140, 0.12);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --background: #152431;
      --card: rgba(31, 49, 64, 0.9);
      --text: #edf6fc;
      --muted: #a7bac8;
      --accent: #91d3f5;
      --line: rgba(201, 226, 242, 0.16);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.24);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.72), transparent 30%),
        var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      transition: background-color 220ms ease, color 220ms ease;
    }

    .card {
      width: min(100%, 560px);
      padding: clamp(28px, 7vw, 54px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .top-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 30px;
    }

    .theme-toggle,
    .language-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font: inherit;
      cursor: pointer;
      transition: background 180ms ease, transform 180ms ease;
    }

    .theme-toggle:hover,
    .language-toggle:hover {
      background: var(--line);
      transform: translateY(-1px);
    }

    .theme-toggle:focus-visible,
    .language-toggle:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    html[data-js="ready"] .reveal {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 900ms ease, transform 900ms ease;
    }

    html[data-js="ready"] .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .char {
      display: inline-block;
      animation: letter-wave 1.2s ease both;
      animation-delay: calc(var(--char-index) * 60ms);
    }

    @keyframes letter-wave {
      0% { opacity: 0; transform: translateY(6px); }
      55% { opacity: 1; transform: translateY(-3px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 12vw, 4.5rem);
      line-height: 1;
      letter-spacing: 0.03em;
    }

    .intro {
      margin: 22px 0 34px;
      color: var(--muted);
      font-size: clamp(1.05rem, 4vw, 1.25rem);
      line-height: 1.8;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 420px) {
      .card {
        border-radius: 22px;
      }

      .top-row {
        margin-bottom: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="top-row reveal">
      <button class="language-toggle" id="language-toggle" type="button" aria-label="切换语言">
        <span id="language-label">中文</span>
      </button>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
        <span id="theme-icon" aria-hidden="true">🌙</span>
        <span id="theme-label" data-i18n="darkMode">深色模式</span>
      </button>
    </div>

    <section class="hero-copy reveal" aria-label="个人介绍">
      <p class="eyebrow" data-i18n="greeting">你好，很高兴认识你</p>
      <h1 data-i18n="name">CHAI</h1>
      <p class="intro" data-i18n="motto">一切都是波浪</p>
    </section>
  </main>

  <script>
    const translations = {
      zh: {
        title: "CHAI · 个人介绍",
        name: "CHAI",
        greeting: "你好，很高兴认识你",
        motto: "一切都是波浪",
        darkMode: "深色模式",
        lightMode: "浅色模式",
        languageButton: "中文",
        languageAction: "切换语言",
        introLabel: "个人介绍"
      },
      en: {
        title: "CHAI · About me",
        name: "CHAI",
        greeting: "Hello, nice to meet you",
        motto: "Everything is a wave",
        darkMode: "Dark mode",
        lightMode: "Light mode",
        languageButton: "EN",
        languageAction: "Change language",
        introLabel: "About me"
      },
      fr: {
        title: "CHAI · À propos",
        name: "CHAI",
        greeting: "Bonjour, ravi de vous rencontrer",
        motto: "Tout est une vague",
        darkMode: "Mode sombre",
        lightMode: "Mode clair",
        languageButton: "FR",
        languageAction: "Changer de langue",
        introLabel: "À propos"
      }
    };
    const languageCodes = ["zh", "en", "fr"];
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const languageToggle = document.querySelector("#language-toggle");
    const languageLabel = document.querySelector("#language-label");
    const themeToggle = document.querySelector("#theme-toggle");
    const themeLabel = document.querySelector("#theme-label");
    const themeIcon = document.querySelector("#theme-icon");
    let currentLanguage = "zh";

    function animateText(element) {
      const text = element.textContent;
      element.setAttribute("aria-label", text);
      if (reducedMotion.matches) return;

      const fragment = document.createDocumentFragment();
      const characters = typeof Intl.Segmenter === "function"
        ? Array.from(new Intl.Segmenter(currentLanguage, { granularity: "grapheme" }).segment(text), item => item.segment)
        : Array.from(text);
      characters.forEach((character, index) => {
        if (/\s/u.test(character)) {
          fragment.append(document.createTextNode(character));
          return;
        }
        const span = document.createElement("span");
        span.className = "char";
        span.setAttribute("aria-hidden", "true");
        span.style.setProperty("--char-index", index);
        span.textContent = character;
        fragment.append(span);
      });
      element.replaceChildren(fragment);
    }

    function animateVisibleText(container) {
      container.querySelectorAll("[data-i18n], #language-label").forEach(animateText);
    }

    function updateLanguage() {
      const words = translations[currentLanguage];
      document.documentElement.lang = currentLanguage === "zh" ? "zh-CN" : currentLanguage;
      document.title = words.title;
      document.querySelector(".hero-copy").setAttribute("aria-label", words.introLabel);
      document.querySelectorAll("[data-i18n]").forEach(element => {
        const key = element.dataset.i18n;
        const text = key === "darkMode" && document.documentElement.dataset.theme === "dark"
          ? words.lightMode
          : words[key];
        element.textContent = text;
        if (element.closest(".reveal")?.classList.contains("is-visible")) animateText(element);
      });
      languageLabel.textContent = words.languageButton;
      languageToggle.setAttribute("aria-label", words.languageAction);
      if (languageLabel.closest(".reveal")?.classList.contains("is-visible")) animateText(languageLabel);
    }

    document.documentElement.dataset.js = "ready";
    const revealItems = document.querySelectorAll(".reveal");
    if (reducedMotion.matches || !("IntersectionObserver" in window)) {
      revealItems.forEach(item => item.classList.add("is-visible"));
    } else {
      const revealObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            animateVisibleText(entry.target);
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });
      revealItems.forEach(item => revealObserver.observe(item));
    }

    updateLanguage();

    languageToggle.addEventListener("click", () => {
      const index = languageCodes.indexOf(currentLanguage);
      currentLanguage = languageCodes[(index + 1) % languageCodes.length];
      updateLanguage();
    });

    themeToggle.addEventListener("click", () => {
      const isDark = document.documentElement.dataset.theme !== "dark";
      document.documentElement.dataset.theme = isDark ? "dark" : "light";
      themeToggle.setAttribute("aria-pressed", String(isDark));
      themeIcon.textContent = isDark ? "☀️" : "🌙";
      const words = translations[currentLanguage];
      themeLabel.textContent = isDark ? words.lightMode : words.darkMode;
      animateText(themeLabel);
    });
  </script>
</body>
</html>
